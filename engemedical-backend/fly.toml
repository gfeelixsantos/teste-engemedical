app = "cmso360-backend"
primary_region = "gru"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3333"
  TZ = "America/Sao_Paulo"

[http_service]
  internal_port = 3333
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  strategy = "bluegreen"
