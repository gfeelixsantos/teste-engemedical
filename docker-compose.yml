services:
  # ============================================================
  # Frontend — Next.js Dev Server (:3000)
  # ============================================================
  frontend:
    build:
      context: ./engemedical-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./engemedical-frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - ./engemedical-frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - engemedical
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # Backend — NestJS Dev Server (:3333)
  # ============================================================
  backend:
    build:
      context: ./engemedical-backend
      dockerfile: Dockerfile.dev
    ports:
      - "3333:3333"
    volumes:
      - ./engemedical-backend:/app
      - backend_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3333
      - TZ=America/Sao_Paulo
      - WORKER_INTERNAL_BASE_URL=http://worker:3334
    env_file:
      - ./engemedical-backend/.env
    depends_on:
      worker:
        condition: service_healthy
    networks:
      - engemedical
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # Worker — NestJS Dev Server (:3334)
  # ============================================================
  worker:
    build:
      context: ./engemedical-worker
      dockerfile: Dockerfile.dev
    ports:
      - "3334:3334"
    volumes:
      - ./engemedical-worker:/app
      - worker_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3334
      - TZ=America/Sao_Paulo
    env_file:
      - ./engemedical-worker/.env
    networks:
      - engemedical
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3334"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  engemedical:
    driver: bridge

volumes:
  frontend_modules:
  backend_modules:
  worker_modules:
