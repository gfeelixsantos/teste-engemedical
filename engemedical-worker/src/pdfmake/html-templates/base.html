<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ═══════════════════════════════════════════════════════════════
       PALETA CORPORATE HEALTH - Engemedical
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --azul-escuro: #0D47A1;
      --ciano: #0097A7;
      --verde: #2E7D32;
      --verde-escuro: #1B5E20;
      --texto: #212121;
      --muted: #757575;
      --borda: #E0E0E0;
      --fundo: #F5F5F5;
      --branco: #FFFFFF;
      --apto: #2E7D32;
      --inapto: #C62828;
      --atencao: #E65100;
    }

    /* ═══ RESET E BASE ═══ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10pt;
      line-height: 1.4;
      color: var(--texto);
      background: var(--branco);
    }

    /* ═══ CABEÇALHO ═══ */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--ciano);
    }

    .header-logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
    }

    .header-title {
      flex: 1;
      text-align: center;
      padding: 0 20px;
    }

    .header-title h1 {
      font-size: 22pt;
      font-weight: 700;
      color: var(--azul-escuro);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .header-title .subtitle {
      font-size: 9pt;
      color: var(--muted);
      letter-spacing: 1px;
    }

    .header-spacer {
      width: 110px;
    }

    /* ═══ WATERMARK ═══ */
    .watermark {
      position: fixed;
      right: -100px;
      top: 80px;
      width: 500px;
      height: auto;
      opacity: 0.06;
      z-index: -1;
      pointer-events: none;
    }

    /* ═══ SEÇÕES ═══ */
    .section {
      margin-top: 16px;
      margin-bottom: 8px;
    }

    .section-title {
      display: flex;
      align-items: center;
      background: var(--fundo);
      border-left: 4px solid var(--ciano);
      padding: 8px 12px;
      font-weight: 600;
      font-size: 10pt;
      color: var(--texto);
    }

    .section-title.blue {
      border-left-color: var(--azul-escuro);
    }

    .section-title.green {
      border-left-color: var(--verde);
    }

    .section-title.cyan {
      border-left-color: var(--ciano);
    }

    /* ═══ CARDS ═══ */
    .card {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }

    /* ═══ GRID DE DADOS ═══ */
    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 24px;
    }

    .data-grid.three-cols {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .data-grid.four-cols {
      grid-template-columns: 1fr 1fr 1fr 1fr;
    }

    .data-field {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .data-field .label {
      font-size: 8pt;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .data-field .value {
      font-size: 9.5pt;
      color: var(--texto);
      word-break: break-word;
    }

    /* ═══ LADO A LADO ═══ */
    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ═══ CONCLUSÃO ═══ */
    .conclusao {
      text-align: center;
      padding: 16px;
      margin: 16px 0;
      border-radius: 8px;
    }

    .conclusao.apto {
      color: var(--apto);
    }

    .conclusao.inapto {
      color: var(--inapto);
    }

    .conclusao h2 {
      font-size: 20pt;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ═══ TABELA ═══ */
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th {
      font-size: 7.5pt;
      font-weight: 600;
      color: var(--muted);
      text-align: left;
      padding: 4px 8px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--borda);
    }

    .data-table td {
      font-size: 9pt;
      color: var(--texto);
      padding: 4px 8px;
      border-bottom: 1px solid var(--fundo);
    }

    /* ═══ LISTA ═══ */
    .item-list {
      list-style: none;
      padding: 0;
    }

    .item-list li {
      padding: 4px 0;
      font-size: 9pt;
      color: var(--texto);
      border-bottom: 1px solid var(--fundo);
    }

    .item-list li:last-child {
      border-bottom: none;
    }

    /* ═══ RODAPÉ LEGAL ═══ */
    .legal-footer {
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px solid var(--borda);
      font-size: 7pt;
      color: var(--muted);
      text-align: center;
      font-style: italic;
    }

    /* ═══ IMPRESSÃO ═══ */
    @media print {
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      
      .watermark {
        position: fixed;
        right: -100px;
        top: 80px;
      }
    }
  </style>
</head>
<body>
  {{content}}
</body>
</html>
